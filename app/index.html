<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get the Kingston CC app</title>
  <meta name="description" content="Download the Kingston CC club app for iPhone or Android.">
  <meta property="og:title" content="Get the Kingston CC app">
  <meta property="og:description" content="Fixtures, availability, team sheets and stats for Kingston Cricket Club.">
  <meta property="og:image" content="https://shkhaliq.github.io/kingston-cc/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="stylesheet" href="../style.css">
  <script>
    // Send phones straight to their store; everyone else sees both links below.
    (function () {
      var ua = navigator.userAgent;
      var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      if (isIOS) location.replace("https://apps.apple.com/app/id6828550739");
      else if (/Android/.test(ua)) location.replace("https://play.google.com/store/apps/details?id=com.kingston.cricketclub");
    })();
  </script>
  <style>
    .stores { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
    .stores a {
      background: var(--navy); color: var(--cream); text-decoration: none; font-weight: 600;
      padding: 12px 20px; border-radius: 14px; border: 1px solid var(--ink-secondary);
    }
  </style>
</head>
<body>
<main>
  <header class="hero">
    <img src="../crest.png" alt="Kingston Cricket Club crest">
    <div>
      <h1>Kingston CC</h1>
      <p>The club app for Kingston Cricket Club’s Winter League squad</p>
    </div>
  </header>

  <section>
    <h2>Get the app</h2>
    <p>Fixtures, availability, team sheets and stats, on your phone.</p>
    <div class="stores">
      <a href="https://apps.apple.com/app/id6828550739">Download on the App Store</a>
      <a href="https://play.google.com/store/apps/details?id=com.kingston.cricketclub">Get it on Google Play</a>
    </div>
  </section>
</main>
</body>
</html>
